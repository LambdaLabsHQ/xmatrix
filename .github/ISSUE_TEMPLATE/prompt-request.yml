name: Prompt request
description: Contribute a problem, desired outcome and acceptance checks. A prompt is optional.
title: "prompt: "
body:
  - type: markdown
    attributes:
      value: |
        Prompt requests are welcome as community contributions. Describe the problem, desired outcome and checks that would show the change works; no coding or prompt-writing experience is required. Maintainers triage requests before an agent implements an accepted change in a regular pull request, with credit and a link back to your request. Use this issue form rather than an external pull request.

        This is a public issue. Leave out tokens, secrets, private repository names and private data, including in attachments, screenshots and logs.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable behavior should be true after the change?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior and reproduction
      description: For a bug, list the steps and what you observed. For an improvement, describe the current workflow and where it falls short.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: Give concrete steps, examples or checks that would demonstrate the desired outcome. Plain-language checks are welcome; test code is not required.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Context and constraints
      description: Relevant files, affected platforms, compatibility requirements and what must not change. You may attach a reproduction script if helpful.
    validations:
      required: false
  - type: textarea
    id: prompt
    attributes:
      label: Prompt or implementation notes (optional)
      description: An optional prompt, suggested approach or reference patch. A clear problem and acceptance checks are enough to submit a request.
    validations:
      required: false
