name: Production Release Intent
run-name: Production Release Intent ${{ inputs.channel }} ${{ inputs.release_components }}${{ inputs.candidate != '' && format(' from {0}', inputs.candidate) || '' }} at ${{ github.sha }}

# Asking for a release records an intent and wakes the train. The train
# (Production Release Request) is serialized repository-wide and chooses the
# version itself; the version says the channel (scripts/release-train.mjs):
#
# - beta, the default: any Agent, after merging. The train ships the union of
#   every open beta its frozen main revision contains as X.Y.Z-beta.N: Hub and
#   Web to production, clients to their dev channel and TestFlight.
# - stable: the stable release Agent, naming a beta it verified and the patch,
#   minor or major bump its changes call for. The train rebuilds exactly that
#   beta's source as X.Y.Z and ships the named clients to their stable channel
#   and App Review. Hub and Web already run every beta.
#
# Intents live in refs, so a train that GitHub displaces while pending loses nothing.
on:
  workflow_dispatch:
    inputs:
      release_components:
        description: Comma-separated hub,web,cli,desktop,android,ios or all (a stable names clients only)
        required: true
        default: hub
        type: string
      channel:
        description: beta, or stable for the stable release Agent
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      candidate:
        description: "Stable only: the verified beta tag, xmatrix-vX.Y.Z-beta.N"
        required: false
        default: ""
        type: string
      bump:
        description: "Stable only: patch, minor or major over the last stable, as its changes call for"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  record:
    runs-on: ${{ vars.XMATRIX_RUNNER_FLEET == 'self-hosted' && fromJSON('["self-hosted","xmatrix-us-release"]') || 'ubuntu-24.04' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Require the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "A production release intent must be dispatched from the default branch" >&2
          exit 1
      # A stable intent reads the candidate's release commit and the last
      # stable's source, so it needs the history; a beta needs only scripts.
      # (`x && 0 || 1` would always be 1: 0 is falsy in expressions.)
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ inputs.channel == 'stable' && '0' || '1' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install-deps: "false"
      - id: intent
        name: Check the intent against its evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMPONENTS: ${{ inputs.release_components }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_CANDIDATE: ${{ inputs.candidate }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: >-
          node scripts/release-train.mjs intent "$GITHUB_RUN_ID" "$RELEASE_CHANNEL" "$RELEASE_COMPONENTS"
          "$RELEASE_CANDIDATE" "$RELEASE_BUMP"
      - name: Record the intent and wake the train
        uses: actions/github-script@v7
        env:
          INTENT_REF: ${{ steps.intent.outputs.ref }}
          INTENT_SHA: ${{ steps.intent.outputs.sha }}
          RELEASE_TOKEN: ${{ secrets.XMATRIX_RELEASE_GITHUB_TOKEN }}
        with:
          # A runner-side "fetch failed" is retried rather than failing the job.
          retries: 3
          github-token: ${{ secrets.XMATRIX_RELEASE_GITHUB_TOKEN }}
          script: |
            if (!process.env.RELEASE_TOKEN) {
              core.setFailed("XMATRIX_RELEASE_GITHUB_TOKEN is required to record a release intent");
              return;
            }
            const ref = process.env.INTENT_REF;
            const sha = process.env.INTENT_SHA;
            if (!/^refs\/release-intents\/[1-9]\d*\//.test(ref ?? "") || !/^[0-9a-f]{40}$/.test(sha ?? "")) {
              core.setFailed("The intent check produced no intent to record");
              return;
            }
            await github.rest.git.createRef({ ...context.repo, ref, sha });
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "production-release-request.yml",
              ref: context.payload.repository.default_branch,
            });
            core.notice(`Recorded ${ref} at ${sha} and woke the release train`);
            await core.summary
              .addHeading("Production release intent recorded")
              .addRaw(`Intent: ${ref}\n\nRevision: ${sha}\n`)
              .write();
