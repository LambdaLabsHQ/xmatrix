name: Close external pull requests

# The public snapshot takes prompt requests, not pull requests from forks.
# This job never checks out the pull request. Same-repository branches stay open.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = [
              "This repository accepts prompt requests, not external pull requests.",
              "Open an issue with the Prompt request template: the outcome, the current behavior, and a prompt a maintainer can run.",
              "This pull request will be closed.",
            ].join(" ");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed",
            });
