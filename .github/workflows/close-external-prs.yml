name: Close external pull requests

# The public snapshot takes prompt requests, not pull requests from forks.
# This job never checks out the pull request. Same-repository branches stay open.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const repositoryUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const body = [
              "Community contributions are welcome through Prompt request issues.",
              `Open a [Prompt request](${repositoryUrl}/issues/new?template=prompt-request.yml) with the current behavior, reproduction, desired outcome and acceptance checks. A prompt or reference patch is optional.`,
              "Maintainers triage requests, then an agent implements accepted changes in a regular PR that links back to and credits the request.",
              `Team members and their agents must use the [repository branch workflow](${repositoryUrl}/blob/main/AGENTS.md#branches) for implementation PRs; branches in personal forks are still fork PRs.`,
              "This pull request will be closed.",
            ].join(" ");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed",
            });
