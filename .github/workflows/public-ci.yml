name: Public Snapshot CI

# Every partition, on demand. Merging runs nothing more: release trains gate
# what they ship (ci.yml, scripts/ci-areas.mjs releaseOutputs).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      force_full_matrix: true
      linux_runner: '"ubuntu-24.04"'
      offload_runner: '"ubuntu-24.04"'
      windows_runner: '"windows-2025"'
      hosted: true
