name: CodeQL

# Code scanning, apart from the release train. CodeQL's security-extended
# queries file code scanning alerts on main; they are findings to work
# through, not a verdict on a release, so no train waits for them. Each push
# to main scans what every beta ships: Hub, Web and Desktop JavaScript and
# TypeScript, and the workflows. A daily run, or one dispatched by hand, scans every
# language, Rust, Kotlin and Swift included. A scan that has started
# finishes; while it runs, GitHub keeps only the newest waiting push, so main
# is scanned as often as a scan takes. Cancelling the running scan for each
# push left none finishing while merges arrived every few minutes. Test code never ships, so it
# is not scanned. The JavaScript and TypeScript analysis runs as two halves
# side by side. Rust stays one analysis so cross-crate flow remains. This
# CodeQL only accepts Rust build-mode none. Its rust-analyzer does not load
# an include! that leaves the crate, so the shared action-name macro is an
# ordinary macro in its own crate and expanded at each call. GitHub's default
# setup must stay disabled: it refuses a workflow's upload while it is on.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      analyses: ${{ steps.plan.outputs.analyses }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - id: plan
        name: Choose the analyses for this trigger
        env:
          SCAN: ${{ github.event_name == 'push' && 'push' || 'full' }}
        run: echo "analyses=$(node scripts/release-train.mjs codeql "$SCAN")" >> "$GITHUB_OUTPUT"

  analyze:
    needs: plan
    name: CodeQL (${{ matrix.language }}${{ matrix.part != 'all' && format(' {0}', matrix.part) || '' }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.analyses) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'swift' && 'autobuild' || 'none' }}
          queries: security-extended
          config: ${{ matrix.config }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: ${{ matrix.category }}
