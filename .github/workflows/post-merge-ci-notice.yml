name: Post-merge CI notice

# Pull request CI runs only the fast tier (ci.yml, `changes`); the slow checks
# run after merge in Public Snapshot CI. When that full run fails on main, tell
# the pull request whose merge produced the commit: a comment reaches the
# authoring Agent's subscribed channel. This workflow runs the default
# branch's definition, checks out no code and holds only the token scope it
# needs to read the run and comment.
on:
  workflow_run:
    workflows: [Public Snapshot CI]
    types: [completed]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Comment on the merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')"
          if [ -z "$pr" ]; then
            echo "No merged pull request produced $SHA; nothing to notify."
            exit 0
          fi
          failed="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- [\(.name)](\(.html_url))"')"
          body="$(printf 'Post-merge CI failed on `%s`, the merge of this pull request.\n\nFailing jobs:\n%s\n\nRun: %s\n' \
            "$SHA" "${failed:-"- (see the run)"}" "$RUN_URL")"
          gh api "repos/$GH_REPO/issues/$pr/comments" -f body="$body" --jq .html_url
