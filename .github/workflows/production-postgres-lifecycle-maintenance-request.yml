name: Production PostgreSQL Lifecycle Maintenance Request
run-name: PostgreSQL lifecycle request ${{ github.event_name == 'schedule' && 'false-1000000' || format('{0}-{1}', inputs.dry_run, inputs.max_rows) }}

on:
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report eligible rows without deleting them
        required: true
        default: true
        type: boolean
      max_rows:
        description: Maximum rows deleted per relation per database
        required: true
        default: "10000"
        type: choice
        options: ["10000", "100000", "1000000"]

permissions:
  actions: write
  contents: read

concurrency:
  group: production-postgres-lifecycle-maintenance-request
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.XMATRIX_RUNNER_FLEET == 'self-hosted' && fromJSON('["self-hosted","xmatrix-us-release"]') || 'ubuntu-24.04' }}
    timeout-minutes: 8
    steps:
      # Main's selection policy only. This job still receives no production credentials.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Dispatch from the latest successful production tag
        uses: actions/github-script@v7
        env:
          REQUEST_DRY_RUN: ${{ inputs.dry_run }}
          REQUEST_MAX_ROWS: ${{ inputs.max_rows }}
        with:
          # A runner-side "fetch failed" is retried rather than failing the job.
          retries: 3
          script: |
            const { resolveMaintenanceRelease } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/postgres-lifecycle-maintenance-policy.mjs`);
            const dryRun = context.eventName === "schedule" ? "false" : process.env.REQUEST_DRY_RUN;
            const maxRows = context.eventName === "schedule" ? "1000000" : process.env.REQUEST_MAX_ROWS;
            if (!/^(?:true|false)$/.test(dryRun)) throw new Error("invalid dry_run");
            if (!/^(?:10000|100000|1000000)$/.test(maxRows)) throw new Error("invalid max_rows");
            // Self-hosted runners have been served run lists days out of date
            // (they dispatched 0.16.316 and 0.16.336 after 0.16.347 shipped).
            // Ask for an uncached list and log what was seen.
            const listReleases = (params) => github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: "production-release.yml",
              event: "workflow_dispatch", per_page: 100, ...params,
              uncached: `${context.runId}-${Date.now()}`, headers: { "cache-control": "no-cache" },
            });
            const history = await listReleases({ status: "success" });
            const day = new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
            let production;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const recent = await listReleases({ status: "success", created: `>=${day}` });
              const open = [
                ...await listReleases({ status: "in_progress" }),
                ...await listReleases({ status: "queued" }),
              ];
              const decision = resolveMaintenanceRelease({ history, recent, openRuns: open });
              core.info(`Saw ${history.length} successful releases and ${recent.length} since ${day}; choice ${decision.release?.head_branch ?? "none"} (run ${decision.release?.id ?? "none"}), wait ${decision.wait}`);
              if (!decision.release) throw new Error("no successful production release tag is available");
              if (!decision.wait) { production = decision.release; break; }
              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }
            if (!production) throw new Error("a newer Production Release was still running");
            const tagRef = (await github.rest.git.getRef({
              ...context.repo, ref: `tags/${production.head_branch}`,
            })).data.object;
            if (tagRef.type !== "tag") throw new Error("production tag must be annotated");
            const tagObject = (await github.rest.git.getTag({
              ...context.repo, tag_sha: tagRef.sha,
            })).data.object;
            if (tagObject.type !== "commit" || tagObject.sha !== production.head_sha) {
              throw new Error("production tag no longer targets its successful release SHA");
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "production-postgres-lifecycle-maintenance.yml",
              ref: production.head_branch,
              inputs: { broker_run_id: String(context.runId), dry_run: dryRun, max_rows: maxRows },
            });
            core.notice(`Dispatched lifecycle maintenance from ${production.head_branch}`);
