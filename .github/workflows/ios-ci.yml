name: iOS CI

# Builds the iOS app and runs its unit tests on a simulator when a pull request
# touches the app, or on demand for any ref. Signing and upload stay in
# ios-testflight.yml; nothing here needs a secret.
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-ci.yml"
      - ".github/actions/ios-simulator-test/**"
      - ".github/workflows/production-release-request.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/ios-simulator-test
