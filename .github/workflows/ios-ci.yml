name: iOS CI

# Builds the iOS app and runs its unit tests on a simulator when a pull request
# touches the app, or on demand for any ref. Signing and upload stay in
# ios-testflight.yml; nothing here needs a secret.
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode.app"
          if [[ ! -d "$XCODE_APP" ]]; then
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v beta | sort -r | head -n 1 || true)"
          fi
          if [[ -z "$XCODE_APP" || ! -d "$XCODE_APP" ]]; then
            echo "Xcode 26 is required." >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version

      # The runner image decides which simulators exist; take any iPhone on an iOS 26 runtime.
      - name: Pick an iPhone simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS-26" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No iPhone simulator on an iOS 26 runtime")
          ')"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/xMatrix.xcodeproj \
            -scheme xMatrix \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test
