name: Test Deep Smoke

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-deep-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ${{ vars.XMATRIX_RUNNER_FLEET == 'self-hosted' && fromJSON('["self-hosted","local-linux-x64"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/clear-linux-proxy
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install-deps: "false"
      - name: Verify deployed test message, reconnect, R2, and cleanup paths
        env:
          XMATRIX_MOCK_AUTH_TOKEN: ${{ secrets.XMATRIX_MOCK_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          XMATRIX_HUB_ORIGIN="$(node scripts/deploy-config.mjs origin test hub)"
          node scripts/hub-postdeploy-smoke.mjs --url "$XMATRIX_HUB_ORIGIN/" --attempts 12 --delay-ms 5000
          node scripts/hub-network-e2e/run-reconnect-catchup.mjs \
            --hub-url "$XMATRIX_HUB_ORIGIN" \
            --token "$XMATRIX_MOCK_AUTH_TOKEN" \
            --messages 3 --exercise-attachment --cleanup --skip-local-worker \
            --results-dir "$RUNNER_TEMP/test-deep-smoke"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-deep-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-deep-smoke/*.json
          if-no-files-found: ignore
          retention-days: 30
