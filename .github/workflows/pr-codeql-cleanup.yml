name: Superseded PR CodeQL cleanup

on:
  pull_request_target:
    types: [synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Open upstream PR whose superseded CodeQL scans to reclaim
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: pr-codeql-cleanup-${{ github.event.pull_request.number || inputs.pull_number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The privileged job executes only default-branch code, never PR code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Cancel only proven ancestors of the current PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pr-codeql-cleanup.mjs
