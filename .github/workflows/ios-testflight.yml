name: iOS TestFlight

on:
  workflow_call:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    environment: production
    timeout-minutes: 60
    runs-on: ${{ github.event.repository.private && vars.XMATRIX_RUNNER_FLEET == 'self-hosted' && fromJSON('["self-hosted","xmatrix-macos-release"]') || 'macos-26' }}
    permissions:
      actions: read
      contents: read
    env:
      IOS_BUILD_NUMBER: ${{ github.run_id }}
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      IOS_MARKETING_VERSION: ${{ vars.IOS_MARKETING_VERSION || '' }}
      IOS_USE_ASC_XCODE_AUTH: "1"
      SKIP_TESTFLIGHT_UPLOAD: "0"
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify release version
        env:
          XMATRIX_RELEASE_BASE_REF: ${{ github.event.before || '' }}
        run: node scripts/check-release-version.mjs

      - name: Select Xcode 26
        run: |
          set -euo pipefail

          XCODE_APP="/Applications/Xcode.app"
          if [[ ! -d "$XCODE_APP" ]]; then
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v beta | sort -r | head -n 1 || true)"
          fi

          if [[ -z "$XCODE_APP" || ! -d "$XCODE_APP" ]]; then
            echo "Xcode 26 is required for App Store upload." >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

          XCODE_VERSION="$(xcodebuild -version)"
          XCODE_FIRST_LINE="${XCODE_VERSION%%$'\n'*}"

          if [[ "$XCODE_FIRST_LINE" != Xcode\ 26.* ]]; then
            echo "Xcode 26 is required for App Store upload, found: $XCODE_FIRST_LINE" >&2
            exit 1
          fi

          xcodebuild -version

      - name: Prepare App Store Connect key
        env:
          ASC_P8_BASE64: ${{ secrets.ASC_P8_BASE64 }}
        run: |
          set -euo pipefail

          umask 077
          [[ "$ASC_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "Invalid Apple API key identifier." >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/appstoreconnect"
          echo "$ASC_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/appstoreconnect/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/appstoreconnect/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "ASC_P8_PATH=$RUNNER_TEMP/appstoreconnect/AuthKey_${ASC_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Reconcile exact Apple build
        id: apple-build
        run: node scripts/ios-app-store.mjs check-upload

      - name: Prepare signing keychain
        if: steps.apple-build.outputs.upload_required == 'true'
        env:
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${IOS_SIGNING_P12_BASE64:-}" || -z "${IOS_SIGNING_P12_PASSWORD:-}" ]]; then
            echo "IOS_SIGNING_P12_BASE64 and IOS_SIGNING_P12_PASSWORD are required." >&2
            exit 1
          fi

          SIGNING_P12="$RUNNER_TEMP/ios-signing.p12"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          WWDR_CERT="$RUNNER_TEMP/AppleWWDRCAG3.cer"
          TEMP_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$IOS_SIGNING_P12_BASE64" | base64 --decode > "$SIGNING_P12"
          chmod 600 "$SIGNING_P12"
          security create-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security import "$SIGNING_P12" \
            -k "$SIGNING_KEYCHAIN" \
            -P "$IOS_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            --output "$WWDR_CERT"
          WWDR_SHA256="$(shasum -a 256 "$WWDR_CERT" | awk '{ print $1 }')"
          if [[ "$WWDR_SHA256" != "dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f" ]]; then
            echo "Unexpected Apple WWDR G3 certificate checksum: $WWDR_SHA256" >&2
            exit 1
          fi
          security import "$WWDR_CERT" -k "$SIGNING_KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$TEMP_KEYCHAIN_PASSWORD" \
            "$SIGNING_KEYCHAIN" \
            >/dev/null
          scripts/macos-keychain-search-list.sh add "$SIGNING_KEYCHAIN"

          IDENTITIES="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN")"
          printf '%s\n' "$IDENTITIES"
          if ! grep -Eq '[1-9][0-9]* valid identities found' <<<"$IDENTITIES"; then
            echo "No valid code-signing identity is available in the prepared keychain." >&2
            exit 1
          fi

      - name: Upload to TestFlight
        if: steps.apple-build.outputs.upload_required == 'true'
        run: bash scripts/ios-testflight.sh

      - name: Submit exact build to App Review
        env:
          ASC_REVIEW_NOTES: ${{ secrets.ASC_REVIEW_NOTES }}
        run: node scripts/ios-app-store.mjs submit

      - name: Remove temporary Apple API key
        if: always()
        run: |
          set -euo pipefail
          [[ "$ASC_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || exit 0
          KEY_PATH="$RUNNER_TEMP/appstoreconnect/AuthKey_${ASC_API_KEY_ID}.p8"
          if [[ -f "$KEY_PATH" ]]; then
            unlink "$KEY_PATH"
          fi

      - name: Restore signing keychain search
        if: always()
        run: |
          set +e

          SIGNING_P12="$RUNNER_TEMP/ios-signing.p12"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          WWDR_CERT="$RUNNER_TEMP/AppleWWDRCAG3.cer"

          cleanup_status=0
          scripts/macos-keychain-search-list.sh remove "$SIGNING_KEYCHAIN" || cleanup_status=$?
          if [[ -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || cleanup_status=$?
          fi
          if [[ -f "$SIGNING_P12" ]]; then
            unlink "$SIGNING_P12" || cleanup_status=$?
          fi
          if [[ -f "$WWDR_CERT" ]]; then
            unlink "$WWDR_CERT" || cleanup_status=$?
          fi
          exit "$cleanup_status"
