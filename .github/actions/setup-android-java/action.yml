name: Setup Android Java
description: Use the self-hosted runner's compatible JDK, with a direct Temurin fallback.
runs:
  using: composite
  steps:
    - name: Use runner JDK when available
      id: system-java
      shell: bash
      run: |
        set -euo pipefail
        java_binary="$(command -v java || true)"
        javac_binary="$(command -v javac || true)"
        if [[ -z "$java_binary" || -z "$javac_binary" ]]; then
          echo "available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        java_home="$(dirname "$(dirname "$(readlink -f "$javac_binary")")")"
        java_major="$("$java_home/bin/java" -version 2>&1 | sed -nE 's/.*version "([0-9]+)(\..*)?".*/\1/p' | head -n 1)"
        javac_major="$("$java_home/bin/javac" -version 2>&1 | sed -nE 's/.* ([0-9]+)(\..*)?.*/\1/p' | head -n 1)"
        if [[ ! "$java_major" =~ ^[0-9]+$ || ! "$javac_major" =~ ^[0-9]+$ || "$java_major" -lt 21 || "$javac_major" -lt 21 || "$java_major" != "$javac_major" ]]; then
          echo "available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
        echo "$java_home/bin" >> "$GITHUB_PATH"
        echo "available=true" >> "$GITHUB_OUTPUT"
    # setup-java resolves the current Temurin build remotely. Keep its
    # fallback lookup on the runner's direct connection, before any proxy.
    - name: Install Java when the runner JDK is unavailable
      if: steps.system-java.outputs.available != 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
