name: Test iOS on an installed simulator
description: Select Xcode and an available iOS 26 iPhone for the simulator gate.
runs:
  using: composite
  steps:
    - name: Select Xcode 26
      shell: bash
      run: |
        set -euo pipefail
        XCODE_APP="/Applications/Xcode.app"
        if [[ ! -d "$XCODE_APP" ]]; then
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v beta | sort -r | head -n 1 || true)"
        fi
        if [[ -z "$XCODE_APP" || ! -d "$XCODE_APP" ]]; then
          echo "Xcode 26 is required." >&2
          ls -1 /Applications | grep '^Xcode' || true
          exit 1
        fi
        echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version

    # Runner images do not guarantee a particular model or the latest SDK's runtime.
    - name: Build and test on an available iPhone
      shell: bash
      run: |
        set -euo pipefail
        UDID="$(xcrun simctl list devices available -j | python3 -c '
        import json, sys
        devices = json.load(sys.stdin)["devices"]
        for runtime in sorted(devices, reverse=True):
            if "iOS-26" not in runtime:
                continue
            for device in devices[runtime]:
                if device["name"].startswith("iPhone"):
                    print(device["udid"])
                    sys.exit(0)
        sys.exit("No iPhone simulator on an iOS 26 runtime")
        ')"
        xcodebuild \
          -project apps/ios/xMatrix.xcodeproj \
          -scheme xMatrix \
          -destination "platform=iOS Simulator,id=$UDID" \
          CODE_SIGNING_ALLOWED=NO \
          test
