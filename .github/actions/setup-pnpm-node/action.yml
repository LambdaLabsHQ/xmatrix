name: Setup Node and PNPM
description: Install Node 22, activate the pinned PNPM version, and optionally install workspace dependencies.
inputs:
  install-deps:
    description: When true, run pnpm install --frozen-lockfile
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # A GitHub-hosted VM is fresh for every job: nothing stale to reclaim and
    # no neighbours to measure. Both diagnostics serve persistent runners.
    - name: Reclaim stale Linux Actions descendants
      if: runner.os == 'Linux' && runner.environment != 'github-hosted'
      shell: bash
      run: bash .github/scripts/cleanup-stale-actions-processes.sh

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        # setup-node v6 enables package-manager caching by default when the
        # repository declares one. Persistent product runners already retain
        # PNPM's store locally, so opt out of its remote cache explicitly.
        package-manager-cache: false

    - name: Record Linux memory capacity
      if: runner.os == 'Linux' && runner.environment != 'github-hosted'
      shell: bash
      run: |
        set -euo pipefail
        free -h || true
        for file in \
          /sys/fs/cgroup/memory.max \
          /sys/fs/cgroup/memory.current \
          /sys/fs/cgroup/memory.events; do
          if [[ -r "$file" ]]; then
            echo "--- $file"
            cat "$file"
          fi
        done
        ps -eo pid=,ppid=,rss=,comm= --sort=-rss | head -n 20 || true
        ps -eo rss=,comm= | awk '
          { count[$2] += 1; rss[$2] += $1 }
          END { for (name in rss) printf "%12d %8d %s\n", rss[name], count[name], name }
        ' | sort -nr | head -n 20 || true

    - name: Enable PNPM
      shell: bash
      run: |
        set -euo pipefail
        pnpm_prefix="$RUNNER_TEMP/xmatrix-pnpm-11.3.0"
        log=$(mktemp)
        trap 'rm -f "$log"' EXIT
        # npm can surface a tarball ECONNRESET without retrying it. Keep one
        # retry budget around this pinned bootstrap, before PNPM is available.
        for attempt in 1 2 3; do
          if npm install --global --prefix "$pnpm_prefix" --no-audit --no-fund \
              --color=false --fetch-retries=0 --fetch-timeout=60000 pnpm@11.3.0 2>&1 | tee "$log"; then
            break
          else
            status=$?
          fi
          if [ "$attempt" -eq 3 ] || ! grep -Eq \
              '^npm (error|ERR!) code (ECONNRESET|ETIMEDOUT|ESOCKETTIMEDOUT|EAI_AGAIN|ECONNREFUSED|ENETUNREACH|EHOSTUNREACH|E408|E429|E500|E502|E503|E504)[[:space:]]*$' "$log"; then
            exit "$status"
          fi
          echo "Transient npm bootstrap failure; retry $attempt/2 in $((attempt * 2)) seconds." >&2
          sleep "$((attempt * 2))"
        done
        node --version
        "$pnpm_prefix/bin/pnpm" --version
        echo "$pnpm_prefix/bin" >> "$GITHUB_PATH"

    # An ephemeral GitHub-hosted runner starts with an empty store, so it
    # restores one from the Actions cache, keyed by the lockfile. Persistent
    # runners never take this path (see below).
    - name: Locate the PNPM store on a GitHub-hosted runner
      id: hosted-store
      if: inputs.install-deps == 'true' && runner.environment == 'github-hosted'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore the PNPM store on a GitHub-hosted runner
      if: inputs.install-deps == 'true' && runner.environment == 'github-hosted'
      uses: actions/cache@v6
      with:
        path: ${{ steps.hosted-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    # PNPM re-checks every lockfile entry against its supply-chain policy
    # (minimumReleaseAge) before installing: a registry metadata request per
    # package, 6-8 s and once 75 s on a hosted VM. It records each passing
    # check in lockfile-verified.jsonl in its cache directory and skips the
    # check only for a lockfile with the same content hash, checked under a
    # policy at least as strict as today's. Carry that record between hosted
    # jobs, so one job per lockfile and policy pays for the check; any other
    # lockfile, policy or PNPM version misses and is checked in full.
    # Persistent runners keep their cache directory and already reuse it.
    - name: Locate the PNPM lockfile verification record on a GitHub-hosted runner
      id: hosted-verified
      if: inputs.install-deps == 'true' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        # PNPM's own cache directory choice (getCacheDir in pnpm).
        if [ -n "${XDG_CACHE_HOME:-}" ]; then dir="$XDG_CACHE_HOME/pnpm"
        elif [ "$RUNNER_OS" = macOS ]; then dir="$HOME/Library/Caches/pnpm"
        elif [ "$RUNNER_OS" = Windows ]; then dir="$LOCALAPPDATA/pnpm-cache"
        else dir="$HOME/.cache/pnpm"
        fi
        echo "path=$dir/lockfile-verified.jsonl" >> "$GITHUB_OUTPUT"

    - name: Restore the PNPM lockfile verification record on a GitHub-hosted runner
      if: inputs.install-deps == 'true' && runner.environment == 'github-hosted'
      uses: actions/cache@v6
      with:
        path: ${{ steps.hosted-verified.outputs.path }}
        key: pnpm-lockfile-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'package.json') }}

    # Supported product jobs use persistent self-hosted runners. PNPM's
    # content-addressed store lives outside each checkout, so clean worktrees
    # reuse the machine-local packages and download only missing lockfile
    # entries. Do not wrap this shared action in a GitHub Actions cache: every
    # job would download and extract the same large remote archive even when
    # its runner-local store is already warm. A future ephemeral workflow may
    # own a separate cache policy without taxing persistent runners.
    # A persistent runner shares its host with other jobs, so its install is
    # throttled; a hosted VM has the machine to itself and installs at full
    # concurrency from the restored store.
    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      env:
        HOSTED: ${{ runner.environment == 'github-hosted' }}
      run: |
        if [ "$HOSTED" = true ]; then
          pnpm install --frozen-lockfile --prefer-offline
        else
          echo "Using persistent runner-local PNPM store: $(pnpm store path --silent)"
          pnpm install --frozen-lockfile --child-concurrency=1 --network-concurrency=4
        fi
