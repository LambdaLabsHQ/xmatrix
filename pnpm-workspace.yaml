packages:
  - "apps/*"
  - "packages/*"

overrides:
  # Deployment config parsing and knip must both use the bounded TOML parser.
  smol-toml: "1.9.0"
  shell-quote: "1.12.0"
  # electron-updater parses the desktop update feed with these.
  # Stay on 4.x; 5.x is a breaking major. 4.3.2 clears the remaining advisory.
  js-yaml: "4.3.2"
  builder-util-runtime: "9.7.0"
  "@hono/node-server": "^1.19.13"
  fast-uri: "^3.1.7"
  fast-xml-parser: "^5.7.0"
  fast-xml-builder: "^1.1.7"
  hono: "^4.12.18"
  ip-address: "^10.3.1"
  postcss: "^8.5.18"
  kysely: "0.29.2"
  # Build-time tooling (OpenNext, shadcn, wrangler/miniflare) pulls these in;
  # keep them past current advisories within their majors.
  "brace-expansion@>=2.0.0 <3": "^2.1.6"
  "brace-expansion@>=4.0.0 <6": "^5.0.11"
  browserslist: "^4.28.7"
  "nanoid@<4": "^3.3.18"
  "undici@>=7.0.0 <8": "^7.29.1"
  "ws@>=8.0.0 <8.21.0": "^8.21.0"
  # Next only uses sharp for runtime image optimization, which OpenNext on Workers does not run.
  sharp: "^0.35.4"

allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  '@sentry/cli': false
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
  workerd: true

patchedDependencies:
  "@base-ui/react@1.3.0": "patches/@base-ui+react+1.3.0.patch"
  "@opennextjs/cloudflare@1.18.0": "patches/@opennextjs+cloudflare+1.18.0.patch"
  "knip@6.12.2": "patches/knip+6.12.2.patch"
  "kysely@0.29.2": "patches/kysely+0.29.2.patch"
  # Stop esbuild watchers before Wrangler removes their temporary inputs on Windows.
  "wrangler@4.79.0": "patches/wrangler+4.79.0.patch"
  # electron-updater@6.8.3 declares builder-util-runtime 9.5.1 exactly.
  # electron-builder matches that declaration, so the 9.7.0 override is not found until this matches.
  "electron-updater@6.8.3": "patches/electron-updater+6.8.3.patch"
