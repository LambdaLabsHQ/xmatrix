[package]
name = "xmatrix-repo-pool"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
regex = { workspace = true }
colored = { workspace = true }
dirs = { workspace = true }
fs2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
xmatrix-cli-core = { path = "../core" }
xmatrix-cli-workspace = { path = "../workspace" }
xmatrix-process-tree = { path = "../process-tree" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
