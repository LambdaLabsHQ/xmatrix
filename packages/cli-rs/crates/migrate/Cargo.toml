[package]
name = "xmatrix-cli-migrate"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
urlencoding = { workspace = true }
# Keep zip on flate2-only deflate support; zip's broader `deflate` feature also compiles zopfli.
zip = { workspace = true, features = ["deflate-flate2"] }
flate2 = { workspace = true, features = ["rust_backend"] }
xmatrix-cli-core = { path = "../core" }

[package.metadata.cargo-machete]
ignored = ["flate2"]
