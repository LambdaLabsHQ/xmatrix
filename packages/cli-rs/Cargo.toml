[package]
name = "xmatrix"
# The release version lives here only. Library crates keep 0.0.0 so a release
# bump does not invalidate their build cache; they read the running version
# from xmatrix_cli_core::version, which main registers.
version = "1.0.146"
edition.workspace = true
license.workspace = true

[workspace]
members = [
  ".",
  "crates/account",
  "crates/agent",
  "crates/args",
  "crates/channel",
  "crates/core",
  "crates/harness",
  "crates/machine",
  "crates/memory",
  "crates/migrate",
  "crates/process-tree",
  "crates/repo-pool",
  "crates/runtime",
  "crates/terminal",
  "crates/update",
  "crates/workspace",
  "crates/windows-continuity",
]
default-members = [
  ".",
  "crates/account",
  "crates/agent",
  "crates/args",
  "crates/channel",
  "crates/core",
  "crates/harness",
  "crates/machine",
  "crates/memory",
  "crates/migrate",
  "crates/process-tree",
  "crates/repo-pool",
  "crates/runtime",
  "crates/terminal",
  "crates/update",
  "crates/workspace",
  "crates/windows-continuity",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "FSL-1.1-ALv2"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22.1"
clap = "4.6"
colored = "3"
dirs = "6"
ed25519-dalek = "2"
flate2 = { version = "1.1", default-features = false }
fs2 = "0.4"
futures-util = "0.3"
gethostname = "1"
getrandom = "0.3.4"
keyring = { version = "4.1.5", default-features = false }
libc = "0.2"
open = "5"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false }
serde = "1"
serde_json = "1"
strsim = "0.11"
sha2 = "0.11.0"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", default-features = false }
tokio-tungstenite = "0.29"
unicode-normalization = "0.1"
url = "2"
urlencoding = "2"
uuid = "1"
which = "8"
windows-sys = "0.61"
zip = { version = "8", default-features = false }
zeroize = "1.8.2"

[[bin]]
name = "xmatrix"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# CLI
clap = { workspace = true, features = ["derive", "env"] }

rustls = { workspace = true, features = ["ring", "std", "tls12"] }

colored = { workspace = true }
xmatrix-cli-args = { path = "crates/args" }
# Registers the release version (xmatrix_cli_core::version). The credential
# helper integration test also builds the helper command with the same
# function the daemon uses, so the two cannot drift apart.
xmatrix-cli-core = { path = "crates/core" }
xmatrix-cli-runtime = { path = "crates/runtime" }
